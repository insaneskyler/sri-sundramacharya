                    "❌ Please login first.";

                return;
            }


            importBtn.disabled = true;

            message.textContent =
                "⏳ Importing services...";


            try {

                const servicesCollection =
                    collection(db, "services");


                for (const service of services) {

                    /*
                     * Create a safe document ID from the service name.
                     */

                    const documentId =
                        service.name
                            .replace(/[\/\\.#$[\]]/g, "-")
                            .trim();


                    await setDoc(
                        doc(
                            servicesCollection,
                            documentId
                        ),
                        {
                            name: service.name,
                            category: service.category,
                            price: service.price,
                            active: true,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        },
                        {
                            merge: true
                        }
                    );

                }

                    error
                );

                message.innerHTML =
                    "❌ <strong>Import failed.</strong><br><br>" +
                    error.message;

                importBtn.disabled = false;

            }

        });

    </script>

</body>

</html>
